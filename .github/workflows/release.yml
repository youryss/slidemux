name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted Publishing needs a recent npm (Node 24 ships one).
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install
      - run: |
          npm install --no-save \
            "@typescript/typescript-linux-x64@$(node -p "require('typescript/package.json').version")" \
            "@rolldown/binding-linux-x64-gnu@$(node -p "require('rolldown/package.json').version")"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Auth via Trusted Publishing (OIDC). No NPM_TOKEN.
      - run: npm publish --access public --provenance
