name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Lockfile is generated on macOS; npm ci omits linux optional natives (typescript, rolldown).
      - run: npm install
      - run: npm run typecheck
      - run: npm test
