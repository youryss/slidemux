name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      # Lockfile from macOS omits other-platform optional natives from the packages map.
      - run: |
          npm install --no-save \
            "@typescript/typescript-linux-x64@$(node -p "require('typescript/package.json').version")" \
            "@rolldown/binding-linux-x64-gnu@$(node -p "require('rolldown/package.json').version")"
      - run: npm run typecheck
      - run: npm test
