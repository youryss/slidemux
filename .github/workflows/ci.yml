name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # TypeScript 7 ships a platform native; macOS lockfiles omit linux-x64.
      - run: npm install --no-save "@typescript/typescript-linux-x64@$(node -p "require('typescript/package.json').version")"
      - run: npm run typecheck
      - run: npm test
